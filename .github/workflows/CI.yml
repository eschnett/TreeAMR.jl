name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macOS-latest]
        # The suite must pass threaded as well as serial. The
        # thread-independence test spawns its own subprocesses either
        # way; this is what runs the rest of the suite on threads.
        threads: [1, 4]
    # Coverage exactly on the single-threaded cells. Turning coverage
    # off on the `threads: 4` cells makes CI faster, because those are
    # the expensive ones -- a 4-vCPU runner is oversubscribed by
    # `--threads=4` plus the subprocesses the thread-independence test
    # spawns.
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.threads == 1 }}
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.threads == 1
      - uses: codecov/codecov-action@v5
        if: matrix.threads == 1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false
