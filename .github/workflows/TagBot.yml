# Creates the git tag and GitHub release for each version registered in
# the General registry. Without it a registration succeeds — the
# registry resolves the tree hash from the commit — but nothing here
# ever records which commit that was, which is how 0.1.0 came to be
# registered with no `v0.1.0` tag. TagBot looks back over registered
# versions that have no tag, so its first run creates the missing one
# as well as the current release.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "How many days back to look for untagged releases"
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # The registry's bot comments on an issue in this repository to
    # announce a registration; `workflow_dispatch` is the manual path,
    # and is what picks up a version registered before this file existed.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A tag pushed with `GITHUB_TOKEN` does not trigger other
          # workflows, so `Documentation.yml`'s `tags: ["*"]` build —
          # the versioned docs — would never fire for a release. A
          # deploy key in `DOCUMENTER_KEY` pushes the tag as a user and
          # does trigger it. The secret is optional: if it is unset,
          # TagBot still tags, and only the versioned docs build is lost.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
