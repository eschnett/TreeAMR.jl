# The nested-mesh ghost fill on one AMD node (`bench/nested.jl`, the mesh
# of eschnett/TreeGeneralizedHarmonic.jl#11), for a baseline and this
# checkout in the same job, run after run, so that the two differ only in
# the package. The baseline is a variant of the study; every run uses the
# study's own bench and test files, so a version whose workload gained a
# case is not charged for compiling it.
#
#     simlaunch snapshot . --study <study> --variant base=<baseline checkout>
#     simlaunch prepare <study> --site symmetry --spec jobs/nested.toml
#     simlaunch submit <study> jobs/nested.toml --site symmetry
#
# Five stages, by the labels' first word (`submit --run` picks runs):
#
# - `compile-`: the `--trace-compile-timing` comparison of
#   `bench/firstcall.jl`, serial on domain 0, three runs of each version
#   (CLAUDE.md's rule for a change to a launch path): the same steps under
#   both versions, on the API every TreeAMR since 0.2 has, since the
#   study's `test/mpi_workload.jl` calls what a half-open baseline lacks
#   (`UnifySchedule`; M22 step 5's `compile-base-` runs failed on it). The
#   tables sum the compile times from the trace in each run's `output.log`.
# - `firstcall-`: `bench/nested.jl` with `TREEAMR_BENCH_FIRSTCALL=1`,
#   serial on domain 0, three runs of each version: the first and second
#   call of `GhostSchedule` and of `fill_ghosts!` on the nested mesh in a
#   fresh process, the same code under both versions.
# - `build-`: `bench/schedule_build.jl`, the cost of building a schedule
#   on the uniform and the nested mesh, cell- and vertex-centered, on
#   domain 0 at 1 and 8 threads.
# - `ghosts-`: `bench/ghosts.jl`, cell-centered (where the single-tap
#   columns of M13 change nothing: the control), on domain 0 at 1 and 8
#   threads.
# - `fill-`: `bench/nested.jl` at `N = 16` over 1, 2 and 4 ranks of one
#   thread and 8 ranks of 8 threads, rank `i` of `R` on NUMA domain
#   `i · 8 / R` and on that domain only (`domains_per_rank = 1`, as
#   M13's tables had it), under the site's default MPI recipe (on Symmetry HPC-X's
#   Open MPI through mpi_abi_wrapper, started by its `mpiexec`).
#
# Each configuration runs in two rounds, the versions in the other order
# in the second (three for the compile timing). The `[after]` command
# prints the tables (`bench/nested_tables.sh`): each quantity's minimum
# per version, and each version against the first. For more versions,
# add variants and runs; the version is the label's second word.
# `jobs/nested-gpu.toml` is the same on H200s.
name = "nested"
env = "test"                        # the bench scripts' dependencies
domains_per_rank = 1                # one domain a rank at any rank count; serial runs on domain 0
vars = { TREEAMR_BENCH_N = "16" }

[site.symmetry]                     # 64 cores in 8 NUMA domains
julia = "1.13"                      # the project's floor, on Symmetry only: an Alliance
                                    # site's MPI recipe names its own patched Julia,
                                    # which cannot be combined with `julia`
time = "2:00:00"                   # past amddebugq's hour
resources = { nodes = 1 }

[after]
cmd = 'bash "$PROJECT"/bench/nested_tables.sh "$SPEC" $SIMLAUNCH_JOBDIRS'

# The compile timing of bench/firstcall.jl, serial, on domain 0.

[[run]]
label = "compile-base-1"
variant = "base"
threads = 1
placement = "numa"
julia_args = ["--trace-compile=stderr", "--trace-compile-timing"]
cmd = "bench/firstcall.jl"

[[run]]
label = "compile-new-1"
