# The replicated O(nleaves) passes at large leaf counts, in one process on
# domain 0 at a rank's 8 threads (no MPI).

[[run]]
label = "replicated"
threads = 8
prefix = "srun --nodes=1 --ntasks=1 --cpus-per-task=64 --cpu-bind=none numactl --cpunodebind=0 --membind=0"
cmd = "bench/replicated.jl 8 64 512 1024"
